name: Runtime diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-diagnostics.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for Worker and capture sanitized diagnostics
        run: |
          set -euo pipefail
          mkdir -p runtime-diagnostics
          status=000
          for i in $(seq 1 18); do
            status=$(curl -sS --max-time 10 \
              -o runtime-diagnostics/latest.json \
              -w '%{http_code}' \
              'https://market-card-bot.pravosudov1994.workers.dev/diagnostics/generation' || true)
            printf '%s\n' "$status" > runtime-diagnostics/http-status.txt
            if [ "$status" = "200" ]; then
              break
            fi
            sleep 5
          done
      - name: Store result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime-diagnostics/latest.json runtime-diagnostics/http-status.txt
          git commit -m 'Capture sanitized runtime diagnostics v2' || exit 0
          git push origin HEAD:main
